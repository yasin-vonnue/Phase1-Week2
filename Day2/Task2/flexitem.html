<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Every Item Property Page</title>
    <link rel="stylesheet" href="flexitem.css" />
  </head>
  <body>
    <header>
      <h1>Every Item Property</h1>
    </header>

    <main>
      <section>
        <h2>flex-grow</h2>

        <div class="container box1">
          <div class="grow0">Item1</div>
          <div class="grow1">Item2</div>
          <div class="grow2">Item3</div>
          <div class="grow3">Item4</div>
          <div class="grow4">Item5</div>
        </div>
      </section>

      <section>
        <h2>flex-shrink</h2>

        <div class="container box2">
          <div class="s1">Item1</div>
          <div class="s2">Item2</div>
          <div class="s3">Item3</div>
          <div class="s4">Item4</div>
        </div>
      </section>

      <section>
        <h2>flex-basis</h2>

        <div class="container box3">
          <div class="basis1">Item1</div>
          <div class="basis2">Item2</div>
          <div class="basis3">Item3</div>
          <div class="basis4">Item4</div>
        </div>
      </section>

      <section>
        <h2>order</h2>

        <div class="container box4">
          <div class="order1">Item1</div>
          <div class="order2">Item2</div>
          <div class="order3">Item3</div>
          <div class="order4">Item4</div>
          <div class="order5">Item5</div>
        </div>
      </section>

      <section>
        <h2>align-self</h2>

        <div class="container box5">
          <div>Item1</div>
          <div>Item2</div>
          <div>Item3</div>
          <div class="special">Item4</div>
          <div>Item5</div>
        </div>
      </section>
    </main>
  </body>
</html>
