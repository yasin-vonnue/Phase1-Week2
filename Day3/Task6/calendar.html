<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS grid demo page</title>
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <header>
      <h1>CSS Grid Calender</h1>
      <h1>July 2026</h1>
    </header>

    <main class="calendar">
      <div class="week-head">Wk</div>
      <div class="day-name">Mon</div>
      <div class="day-name">Tue</div>
      <div class="day-name">Wed</div>
      <div class="day-name">Thu</div>
      <div class="day-name">Fri</div>
      <div class="day-name">Sat</div>
      <div class="day-name">Sun</div>

      <div class="week-number">1</div>

      <div class="date"></div>
      <div class="date"></div>
      <div class="date first-day">1</div>
      <div class="date">2</div>
      <div class="date event">3</div>
      <div class="date">4</div>
      <div class="date">5</div>

      <div class="week-number">2</div>
      <div class="date">6</div>
      <div class="date event">7</div>
      <div class="date">8</div>
      <div class="date">9</div>
      <div class="date">10</div>
      <div class="date">11</div>
      <div class="date">12</div>

      <div class="week-number">3</div>
      <div class="date">13</div>
      <div class="date">14</div>
      <div class="date">15</div>
      <div class="date">16</div>
      <div class="date">17</div>
      <div class="date">18</div>
      <div class="date">19</div>

      <div class="week-number">4</div>
      <div class="date">20</div>
      <div class="date">21</div>
      <div class="date">22</div>
      <div class="date">23</div>
      <div class="date">24</div>
      <div class="date today">25</div>
      <div class="date">26</div>

      <div class="week-number">5</div>
      <div class="date">27</div>
      <div class="date">28</div>
      <div class="date">29</div>
      <div class="date">30</div>
      <div class="date">31</div>
    </main>
  </body>
</html>
