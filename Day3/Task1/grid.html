<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Demo Page</title>
    <link rel="stylesheet" href="grid.css" />
  </head>
  <body>
    <header>
      <h1>Grid Sizing Methods</h1>
    </header>

    <main>
      <h2>Fixed px</h2>
      <div class="container1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>percentage %</h2>
      <div class="container2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>fr unit</h2>
      <div class="container3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>auto value</h2>
      <div class="container4">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>minmax()</h2>
      <div class="container5">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>repeat()</h2>
      <div class="container6">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>repeat() with minmax</h2>
      <div class="container7">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>fr unit with different ratios</h2>
      <div class="container8">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
      </div>

      <h2>implicit grids plus row-gap,column-gap shorthand</h2>
      <!-- item 5 and item 6 are implicit grids because they were generated by default to fit the remaining children -->
      <div class="container9">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
      </div>
    </main>
  </body>
</html>
